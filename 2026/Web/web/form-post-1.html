<!DOCTYPE html>
<html>
    <body>

        <h2>The method Attribute</h2>

        <p>This form will be submitted using the POST method:</p>

        <form action="http://localhost:8001/action" method="POST">
            <label for="page">Scrivi nome pagina</label><br>
            <input type="text" id="page" name="page" value="css.html"><br>
            <input type="submit" value="Submit">
        </form>

        <p>Notice that the form values is NOT visible in the address bar of the new browser tab.</p>

    </body>
</html>
